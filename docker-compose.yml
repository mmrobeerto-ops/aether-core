version: '3.8'

services:
  tzanix-aether-core:
    image: mmrobeerto-ops/tzanix-aether-core:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tzanix-aether-core-trident
    ports:
      - "8000:8000" # Centro de Mando SOC Visual + Fast-Path Gateway API
      - "8080:8080" # Exportador Lock-Free de Telemetría Prometheus (/metrics)
    environment:
      - GATEWAY_MODE=ENFORCE_CUT_THROUGH
      - TZANIX_LICENSE_KEY=${TZANIX_LICENSE_KEY:-tzanix_live_sec_poc_14d_enterprise}
      - TZANIX_DROP_ENTROPY=1.9000
      - TZANIX_FORWARD_ENTROPY=3.5200
      - RUST_LOG=info
    restart: unless-stopped
    depends_on:
      - mock-protected-api
    networks:
      - tzanix-network

  # Backend Corporativo / Médico Protegido detrás del Escudo TZANiX
  mock-protected-api:
    image: nginx:alpine
    container_name: mock-protected-backend-api
    expose:
      - "80"
    volumes:
      - ./scratch/nginx_mock.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    networks:
      - tzanix-network

networks:
  tzanix-network:
    driver: bridge
