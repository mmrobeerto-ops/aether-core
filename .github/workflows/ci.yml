name: TZANIX Core Engine CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build_and_audit:
    name: Build, Audit & Benchmark
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: aarch64-unknown-linux-gnu

      - name: Compilación estricta para entornos no_std (Bare-Metal)
        run: cargo check --lib --no-default-features

      - name: Compilación cruzada para ARM SmartNIC/DPU (NVIDIA BlueField aarch64)
        run: cargo check --target aarch64-unknown-linux-gnu --lib --no-default-features

      - name: Pruebas unitarias, FFI C-ABI, 3-VPS Intrusion Test y Avalancha 10M Flits
        run: cargo test --release
