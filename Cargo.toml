[package]
name = "tzanix-aether-core"
version = "0.1.0"
edition = "2021"
authors = ["TZANiX Core Team"]

[lib]
name = "tzanix_aether_core"
crate-type = ["rlib", "staticlib"]

[profile.dev]
panic = "abort"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"

[dependencies]
memmap2 = { version = "0.9", optional = true }
rand = "0.8"
axum = "0.7"
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Dependencia de Python, aislada y opcional
pyo3 = { version = "0.20", features = ["extension-module"], optional = true }

[features]
default = ["std"]
std = ["dep:memmap2"]
# Feature flag para habilitar compilación de bindings PyO3
python = ["dep:pyo3", "std"]

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "entropy_benchmark"
harness = false
