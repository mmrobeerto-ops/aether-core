[package]
name = "tzanix-aether-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "AGPL-3.0-or-later"
publish = false
authors = ["TZANIX Core Team"]
description = "Motor de análisis de entropía de distribución de IPs para detección de anomalías de red (Q16.16, no_std, zero-heap)"

[lib]
name = "tzanix_aether_core"
crate-type = ["rlib"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

[dependencies]
memmap2 = { version = "0.9", optional = true }
rand = { version = "0.10", optional = true }
axum = { version = "0.7", optional = true }
tokio = { version = "1.0", features = ["full"], optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }

# Dependencia de Python opcional (extension-module separado para no romper cargo test)
pyo3 = { version = "0.22", optional = true }

[features]
default = ["std", "server"]
# std puro: solo activa std y memmap2 para la librería
std = ["dep:memmap2"]
# server: activa el binario HTTP / simulación con tokio, axum, serde y rand
server = ["std", "dep:rand", "dep:axum", "dep:tokio", "dep:serde", "dep:serde_json"]
# Habilita el panic_handler bare-metal cuando no se enlaza con otro binario que defina el suyo
panic-handler = []
# Habilita módulos en investigación sin respaldo empírico en producción
experimental = []
# Feature flag para compilar bindings PyO3 (maturin activa extension-module)
python = ["dep:pyo3", "std"]
extension-module = ["python", "pyo3/extension-module"]

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "entropy_benchmark"
harness = false
