[package]
name = "tzanix-aether-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "AGPL-3.0-or-later"
publish = false
authors = ["TZANIX Core Team"]
description = "Motor de análisis de entropía de distribución de IPs para detección de anomalías de red (Q16.16, no_std, zero-heap)"

[lib]
name = "tzanix_aether_core"
crate-type = ["rlib"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

[dependencies]
memmap2 = { version = "0.9", optional = true }

[features]
default = ["std"]
# std puro: activa std y memmap2 para la librería
std = ["dep:memmap2"]
# Habilita el panic_handler bare-metal cuando no se enlaza con otro binario que defina el suyo
panic-handler = []
